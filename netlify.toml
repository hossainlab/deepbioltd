[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Static images are generated at display size by scripts/gen-thumbs.mjs and are
# served directly rather than through the image optimizer. Without this they
# come back as `max-age=0, must-revalidate`, so every page view refetches them.
# Content changes ship under a new filename, so a long cache is safe.
[[headers]]
  for = "/course_img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/partner_logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
